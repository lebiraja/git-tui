name: Build and Publish

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Prevent infinite loop if the commit is from the bot itself
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    outputs:
      new_version: ${{ steps.bump.outputs.NEW_VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Push back to a branch protected by the "Protect Main" ruleset.
          # GITHUB_TOKEN authenticates as github-actions[bot], which is NOT on
          # the ruleset bypass list and cannot be added via the UI, so the
          # bump-commit / tag pushes were rejected (GH013 "Changes must be made
          # through a pull request"). RELEASE_TOKEN is a PAT owned by a user on
          # the bypass list; pushing with it inherits that bypass. Falls back to
          # GITHUB_TOKEN if the secret is unset (e.g. on forks).
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          NEW_VERSION=$(python scripts/bump_version.py)
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Successfully bumped version to $NEW_VERSION"

      - name: Commit version bump
        run: |
          git add pyproject.toml gitpulse/utils.py npm/package.json
          git commit \
            -m "chore: bump version to ${{ env.NEW_VERSION }} [skip ci]" \
            -m "Co-Authored-By: lebiraja <130662829+lebiraja@users.noreply.github.com>"
          git push origin main

      - name: Create and push tag
        run: |
          git tag -a "v${{ env.NEW_VERSION }}" -m "v${{ env.NEW_VERSION }}"
          git push origin "v${{ env.NEW_VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.NEW_VERSION }}"
          name: "v${{ env.NEW_VERSION }}"
          generate_release_notes: true

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-npm:
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          # The tag created by build-and-publish carries the bumped npm/package.json
          ref: "v${{ needs.build-and-publish.outputs.new_version }}"

      - name: Wait for PyPI to publish the pinned version
        # The npm postinstall installs gitpulse-tui==<version>; make sure that
        # exact version is queryable on PyPI before npm goes live, so a fresh
        # `npm install -g gitpulse` cannot race ahead of PyPI propagation.
        run: |
          VERSION="${{ needs.build-and-publish.outputs.new_version }}"
          URL="https://pypi.org/pypi/gitpulse-tui/${VERSION}/json"
          echo "Waiting for ${URL} ..."
          for i in $(seq 1 60); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$CODE" = "200" ]; then
              echo "gitpulse-tui==${VERSION} is live on PyPI."
              exit 0
            fi
            echo "  attempt $i: HTTP $CODE — retrying in 10s"
            sleep 10
          done
          echo "Timed out waiting for gitpulse-tui==${VERSION} on PyPI."
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        working-directory: npm
        # No `npm install` first — the wrapper has zero dependencies, and
        # skipping it avoids running the Python-bootstrapping postinstall in CI.
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
